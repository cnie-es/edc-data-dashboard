server {
  listen 8080;
  # Detras de APISIX (TLS fuera): nunca generar redirecciones absolutas con http/8080.
  absolute_redirect off;
  root /app;

  location /assets/ {
    try_files $uri =404;
  }

  location /config {
    alias /app/config/;
    try_files $uri$args $uri$args/ =404;
  }

  location / {
    # Sin "$uri$args/": una ruta del SPA que coincide con una carpeta estatica
    # (/assets = "Mis activos") sirve index.html en vez de redirigir al directorio.
    try_files $uri$args /index.html;
  }
}
