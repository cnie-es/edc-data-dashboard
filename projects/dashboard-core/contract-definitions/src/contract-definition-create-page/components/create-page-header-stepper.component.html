<lib-breadcrumbs [items]="breadcrumbItems"></lib-breadcrumbs>

<header class="space-y-3">
  <h1 class="text-3xl font-semibold text-base-content">{{ 'createoffer' | translate }}</h1>
  <div class="rounded-2xl border border-base-300 bg-base-100 px-5 py-5">
    <div class="relative w-full px-4">
      <!-- fondo -->
      <div class="absolute top-4 left-[4%] right-[4%] h-[2px] bg-base-300"></div>

      <!-- progreso -->
      <div
        class="absolute top-4 left-[4%] h-[2px] bg-primary transition-all duration-300"
        [style.width.%]="((currentStep - 1) / 3) * 92"
      ></div>

      <!-- STEPS -->
      <ol class="relative flex justify-between text-sm">
        <!-- STEP 1 -->
        <li class="flex flex-col items-center w-full">
          <div
            class="z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 transition-all"
            [ngClass]="
              currentStep >= 1
                ? 'bg-primary border-primary text-white'
                : 'bg-base-100 border-base-300 text-base-content'
            "
          >
            1
          </div>
          <span
            class="mt-2 text-center"
            [ngClass]="currentStep >= 1 ? 'text-primary font-semibold' : 'text-base-content opacity-60'"
          >
            {{ 'active' | translate }}
          </span>
        </li>

        <!-- STEP 2 -->
        <li class="flex flex-col items-center w-full">
          <div
            class="z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 transition-all"
            [ngClass]="
              currentStep >= 2
                ? 'bg-primary border-primary text-white'
                : 'bg-base-100 border-base-300 text-base-content'
            "
          >
            2
          </div>
          <span
            class="mt-2 text-center"
            [ngClass]="currentStep >= 2 ? 'text-primary font-semibold' : 'text-base-content opacity-60'"
          >
            {{ 'cpoli' | translate }}
          </span>
        </li>

        <!-- STEP 3 -->
        <li class="flex flex-col items-center w-full">
          <div
            class="z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 transition-all"
            [ngClass]="
              currentStep >= 3
                ? 'bg-primary border-primary text-white'
                : 'bg-base-100 border-base-300 text-base-content'
            "
          >
            3
          </div>
          <span
            class="mt-2 text-center"
            [ngClass]="currentStep >= 3 ? 'text-primary font-semibold' : 'text-base-content opacity-60'"
          >
            {{ 'ppoli' | translate }}
          </span>
        </li>

        <!-- STEP 4 -->
        <li class="flex flex-col items-center w-full">
          <div
            class="z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 transition-all"
            [ngClass]="
              currentStep >= 4
                ? 'bg-primary border-primary text-white'
                : 'bg-base-100 border-base-300 text-base-content'
            "
          >
            4
          </div>
          <span
            class="mt-2 text-center"
            [ngClass]="currentStep >= 4 ? 'text-primary font-semibold' : 'text-base-content opacity-60'"
          >
            {{ 'publi' | translate }}
          </span>
        </li>
      </ol>
    </div>
  </div>
</header>
