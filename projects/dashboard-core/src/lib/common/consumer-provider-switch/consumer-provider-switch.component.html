<div class="inline-flex overflow-hidden rounded-sm border border-[#1c1e21] bg-white shadow-none" role="tablist">
  <div
    class="tooltip-left tooltip-primary flex flex-1 border-r border-[#1c1e21]"
    [attr.data-tip]="consumerTooltip"
    [ngClass]="consumerTooltip ? 'tooltip' : ''"
  >
    <label
      class="flex w-full min-w-[11rem] cursor-pointer items-center justify-center whitespace-nowrap bg-white px-5 py-2.5 text-center text-sm font-semibold text-[#1c1e21] hover:bg-neutral-100 has-[:checked]:bg-[#1c1e21] has-[:checked]:text-white"
    >
      <input
        type="radio"
        name="contract-types"
        class="sr-only"
        [checked]="initialType === 'CONSUMER'"
        (change)="changed.emit('CONSUMER')"
      />
      {{ 'consumer' | translate }}
    </label>
  </div>
  <div
    class="tooltip-right tooltip-primary flex flex-1"
    [attr.data-tip]="providerTooltip"
    [ngClass]="providerTooltip ? 'tooltip' : ''"
  >
    <label
      class="flex w-full min-w-[11rem] cursor-pointer items-center justify-center whitespace-nowrap bg-white px-5 py-2.5 text-center text-sm font-semibold text-[#1c1e21] hover:bg-neutral-100 has-[:checked]:bg-[#1c1e21] has-[:checked]:text-white"
    >
      <input
        type="radio"
        name="contract-types"
        class="sr-only"
        [checked]="initialType === 'PROVIDER'"
        (change)="changed.emit('PROVIDER')"
      />
      {{ 'provider' | translate }}
    </label>
  </div>
</div>
