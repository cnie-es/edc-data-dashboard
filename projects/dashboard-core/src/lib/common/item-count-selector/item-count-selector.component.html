<div class="dropdown dropdown-end">
  <button
    type="button"
    tabindex="0"
    class="btn btn-ghost h-11 min-h-0 rounded-sm border border-(--app-color-info-darker) bg-base-100 px-4 text-xs font-semibold normal-case text-base-content hover:bg-base-200"
  >
    <span [textContent]="selectedLabel"></span>
    <span class="material-symbols-rounded text-base leading-none">arrow_drop_down</span>
  </button>
  <ul
    tabindex="0"
    class="menu dropdown-content z-20 mt-1 w-20 rounded-sm border border-base-300 bg-base-100 p-1 shadow-md"
  >
    @for (count of itemCountOptions; track count) {
      <li>
        <button
          type="button"
          class="justify-center text-xs"
          [class.font-semibold]="count === currentItemCount"
          [textContent]="count"
          (click)="selectItemCount(count)"
        ></button>
      </li>
    }
  </ul>
</div>
