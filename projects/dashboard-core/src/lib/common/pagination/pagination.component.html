<div class="join h-10 overflow-hidden rounded-sm border border-base-300 bg-base-100 text-base-content">
  <button
    class="btn btn-sm btn-ghost join-item h-10 min-h-0 w-10 rounded-none border-0 px-0 text-base leading-none font-medium hover:bg-base-200 disabled:bg-base-100 disabled:text-base-content/40"
    (click)="backward()"
    [disabled]="currentPage === 0"
  >
    «
  </button>
  <div class="dropdown dropdown-center dropdown-hover join-item h-full">
    <button
      class="btn btn-sm btn-ghost join-item h-10 min-h-0 rounded-none border-x border-y-0 border-base-300 px-5 text-[11px] font-semibold normal-case hover:bg-base-200"
      [textContent]="pageLabel(currentPage + 1)"
    ></button>
    <ul
      class="menu dropdown-content z-20 mt-1 max-h-64 overflow-auto rounded-sm border border-base-300 bg-base-100 p-1 shadow-md"
    >
      @for (_ of [].constructor(totalPages + 1); track _; let i = $index) {
        <li [tabindex]="i" (keydown)="jump(i)" (click)="jump(i)">
          <a class="text-nowrap text-xs" [textContent]="pageLabel(i + 1)"></a>
        </li>
      }
    </ul>
  </div>
  <button
    class="btn btn-sm btn-ghost join-item h-10 min-h-0 w-10 rounded-none border-0 px-0 text-base leading-none font-medium hover:bg-base-200 disabled:bg-base-100 disabled:text-base-content/40"
    (click)="forward()"
    [disabled]="currentPage === totalPages"
  >
    »
  </button>
</div>
