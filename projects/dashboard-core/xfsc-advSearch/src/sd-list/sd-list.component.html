@if (showSimpleSearchBar) {
  <div class="mb-4 flex gap-3 items-center">
    <lib-filter-input
      placeholder="Filter for name, description ..."
      [focusShortcut]="['Alt', 'j']"
      class="mr-4 grow"
      (inputChange)="updateSimpleQuery($event)"
    ></lib-filter-input>
    <button class="btn btn-primary" type="button" (click)="executeSimpleSearch()">Search</button>
  </div>
}
@if (errorMessage) {
  <div class="alert alert-error mb-4">
    <span [innerText]="errorMessage"></span>
  </div>
}
<div id="card-list-container" class="grid w-full gap-4 grid-cols-1 md:grid-cols-2">
  @for (sd of selfDescriptors; track $index; let i = $index) {
    <lib-sd-card
      [id]="'sd-' + i"
      class="block w-full max-w-2xl mx-auto shadow-xl rounded-2xl [&_>.card]:h-full"
      [sd]="sd"
      [showButtons]="false"
      [showDetailsButton]="true"
      [detailsActionEnabled]="enableDetailsAction"
      (detailsEvent)="openDetails($event)"
    ></lib-sd-card>
  }
  @if (selfDescriptors.length === 0) {
    <lib-list-loading-state variant="grid" [fetched]="!loading">
      @if (!hasCompletedSearch) {
        <p class="text-sm text-base-content/80">{{ 'catalog.searchPrompt' | translate }}</p>
      } @else {
        <p class="text-sm text-base-content/80">{{ 'catalog.noSearchResults' | translate }}</p>
      }
    </lib-list-loading-state>
  }
</div>
