<lib-dashboard-app
  [appConfig]="appConfig"
  [edcConfigs]="edcConfigs"
  [onLogout]="handleLogout"
  [userInfo]="userInfo"
></lib-dashboard-app>

@if (loadingService.loading$ | async) {
  <div class="fixed inset-0 z-[9999] bg-white/60 flex items-center justify-center">
    <span class="loading loading-spinner loading-lg"></span>
  </div>
}
