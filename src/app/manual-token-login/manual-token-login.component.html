<main class="flex min-h-full w-full items-center justify-center p-6">
  <section class="w-full max-w-xl rounded-2xl border border-gray-200 bg-white p-8 shadow-lg">
    <h1 class="text-2xl font-semibold text-gray-900">Development Token Login</h1>
    <p class="mt-2 text-sm text-gray-600">
      Paste a bearer token for development mode. The token is stored only in memory and is cleared on reload.
    </p>

    <label class="mt-6 block w-full">
      <span class="mb-2 block text-sm font-medium text-gray-800">Bearer token</span>
      <textarea
        class="block w-full min-h-32 resize-y rounded-lg border-2 border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-[var(--app-color-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--app-color-primary-light)]"
        [(ngModel)]="tokenValue"
        placeholder="Paste token here..."
        rows="8"
        spellcheck="false"
        autocomplete="off"
      ></textarea>
    </label>

    @if (message) {
      <p class="mt-3 text-sm text-red-600" [innerText]="message"></p>
    }

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-50"
        (click)="clearToken()"
      >
        Clear
      </button>
      <button
        type="button"
        class="rounded-lg bg-[var(--app-color-primary)] px-4 py-2 text-sm font-medium text-white hover:bg-[var(--app-color-primary-dark)]"
        (click)="continueWithToken()"
      >
        Continue
      </button>
    </div>
  </section>
</main>
